[project]
name = "daisy-cotton-ext"
version = "0.4.0"
description = "Extended components and page blocks for django-cotton and daisyUI, built on daisy-cotton"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# The host supplies daisyUI and its theme
# (docs/adr/0002-stylesheet-carries-what-a-host-cannot.md). daisy-cotton supplies the
# base components these are built from (docs/adr/0007-built-from-daisy-cotton-components.md).
dependencies = ["django>=5.2", "django-cotton>=2.6", "daisy-cotton>=0.1.3"]
keywords = ["django", "tailwind", "daisyui", "components", "landing-page", "cotton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/daisy-cotton-ext"
Repository = "https://github.com/django-mvp/daisy-cotton-ext"
Issues = "https://github.com/django-mvp/daisy-cotton-ext/issues"

[dependency-groups]
dev = [
    "mvp-shared[dev,test]",
    # A ready-made daisyUI and Cotton host for the example project.
    "django-mvp>=0.23.0",
    # Development only, and mounted under DEBUG: it serves component source and
    # evaluates URL parameters through the template engine.
    "django-cotton-gallery>=1.0.0,<2.0.0",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daisy_cotton_ext"]

[tool.hatch.build.targets.sdist]
include = ["/daisy_cotton_ext", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["daisy_cotton_ext"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# ruff-base.toml is copied in rather than referenced remotely, because `extend`
# only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# Never deployed: the example settings carry a literal SECRET_KEY on purpose.
"example/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["daisy_cotton_ext"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "daisy_cotton_ext/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.forge.conformance]
# These suites check templates, a built stylesheet and the example project, none of
# which is a Python module in the package, so there is nothing to mirror.
non-mirror-paths = [
    "tests/test_app.py",
    "tests/test_stylesheet.py",
    "tests/test_annotations.py",
    "tests/test_section_blocks.py",
    "tests/test_heading_blocks.py",
    "tests/test_hero_blocks.py",
    "tests/test_background_blocks.py",
    "tests/test_text_blocks.py",
    "tests/test_reveal_blocks.py",
    "tests/test_quote_blocks.py",
    "tests/test_stats_blocks.py",
    "tests/test_footer_blocks.py",
    "tests/test_logos_blocks.py",
    "tests/test_marquee_blocks.py",
    "tests/test_sign_in_blocks.py",
    "tests/test_sign_up_blocks.py",
    "tests/test_auth_blocks.py",
    "tests/test_points_blocks.py",
    "tests/test_demo_catalogue.py",
    "tests/test_component_docs.py",
]

[tool.deptry]
extend_exclude = ["tests/", "example/", "docs/"]

[tool.deptry.per_rule_ignores]
# No Python module imports django-cotton, but without it in INSTALLED_APPS a
# <c-hero.centred> tag renders as literal text while every import still resolves.
# daisy-cotton is the same: its components are reached by tag, never by import.
DEP002 = ["django-cotton", "daisy-cotton"]
